[package]
name = "star-launcher"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "star"
path = "src/main.rs"

[dependencies]
ureq = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
flate2 = "1"
tar = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
