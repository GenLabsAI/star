name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compute next version
        id: bump
        run: |
          latest=$(git tag --list 'v0.1.*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            next="v0.1.0"
          else
            base=${latest#v}
            major=$(echo "$base" | cut -d. -f1)
            minor=$(echo "$base" | cut -d. -f2)
            patch=$(echo "$base" | cut -d. -f3)
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Next version: $next"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            artifact: star-windows-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact: star-linux-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            artifact: star-linux-arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            artifact: star-darwin-amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            artifact: star-darwin-arm64
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Install cross-compilation linker
        if: matrix.goos == 'linux' && matrix.goarch == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build Windows binaries
        if: matrix.goos == 'windows'
        shell: pwsh
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          New-Item -ItemType Directory -Force dist/${{ matrix.artifact }}
          $ldflags = "-s -w -X github.com/charmbracelet/crush/internal/version.Version=$env:VERSION -X github.com/charmbracelet/crush/internal/version.Commit=$env:GITHUB_SHA"
          go build -trimpath -ldflags "$ldflags" -o dist/${{ matrix.artifact }}/star-core.exe .
          rustup target add x86_64-pc-windows-msvc
          cargo build --release --manifest-path launcher/Cargo.toml --target x86_64-pc-windows-msvc
          Copy-Item launcher/target/x86_64-pc-windows-msvc/release/star.exe dist/${{ matrix.artifact }}/star.exe
          Compress-Archive -Path dist/${{ matrix.artifact }}/* -DestinationPath dist/${{ matrix.artifact }}.zip
          Copy-Item launcher/target/x86_64-pc-windows-msvc/release/star.exe dist/star-${{ matrix.goos }}-${{ matrix.goarch }}.exe
      - name: Build Unix binaries
        if: matrix.goos != 'windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist/${{ matrix.artifact }}
          ldflags="-s -w -X github.com/charmbracelet/crush/internal/version.Version=${VERSION} -X github.com/charmbracelet/crush/internal/version.Commit=${GITHUB_SHA}"
          go build -trimpath -ldflags "$ldflags" -o dist/${{ matrix.artifact }}/star-core .
          rust_target="${{ matrix.goarch }}"
          if [ "$rust_target" = "amd64" ]; then rust_target="x86_64"; fi
          if [ "$rust_target" = "arm64" ]; then rust_target="aarch64"; fi
          if [ "${{ matrix.goos }}" = "linux" ]; then rust_triple="${rust_target}-unknown-linux-gnu"; fi
          if [ "${{ matrix.goos }}" = "darwin" ]; then rust_triple="${rust_target}-apple-darwin"; fi
          rustup target add "$rust_triple"
          if [ "$rust_triple" = "aarch64-unknown-linux-gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          cargo build --release --manifest-path launcher/Cargo.toml --target "$rust_triple"
          cp "launcher/target/${rust_triple}/release/star" dist/${{ matrix.artifact }}/star
          chmod +x dist/${{ matrix.artifact }}/star dist/${{ matrix.artifact }}/star-core
          cp "launcher/target/${rust_triple}/release/star" dist/star-${{ matrix.goos }}-${{ matrix.goarch }}
          chmod +x dist/star-${{ matrix.goos }}-${{ matrix.goarch }}
          tar -C dist -czf dist/${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.zip
            dist/${{ matrix.artifact }}.tar.gz
            dist/star-${{ matrix.goos }}-${{ matrix.goarch }}*
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd dist
          sha256sum star-* > checksums.txt
          cd ..
          git tag "$VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" dist/* --generate-notes --title "$VERSION"

  desktop:
    needs: [version, release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'ubuntu-22.04-arm'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Apply Star overlay patches
        shell: bash
        run: |
          for p in clients/star-desktop/patches/*.patch; do
            git -C clients/acp-ui apply --check "$GITHUB_WORKSPACE/$p"
          done
          for p in clients/star-desktop/patches/*.patch; do
            echo "applying $p"
            git -C clients/acp-ui apply "$GITHUB_WORKSPACE/$p"
          done
          git -C clients/acp-ui status --short
      - name: Stamp release version
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re
          tag = os.environ["VERSION"]
          assert tag.startswith("v"), f"expected v-prefixed tag, got {tag!r}"
          version = tag[1:]
          conf = "clients/acp-ui/src-tauri/tauri.conf.json"
          s = open(conf).read()
          s, n = re.subn(r'"version": "[^"]+"', f'"version": "{version}"', s, count=1)
          assert n == 1, "version field not found in tauri.conf.json"
          open(conf, "w").write(s)
          cargo = "clients/acp-ui/src-tauri/Cargo.toml"
          s = open(cargo).read()
          s, n = re.subn(r'^version = "[^"]+"', f'version = "{version}"', s, count=1, flags=re.M)
          assert n == 1, "version field not found in Cargo.toml"
          open(cargo, "w").write(s)
          pkg = "clients/acp-ui/package.json"
          d = json.load(open(pkg))
          d["version"] = version
          json.dump(d, open(pkg, "w"), indent=2)
          open(pkg, "a").write("\n")
          print(f"stamped version {version}")
          PYEOF
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: clients/acp-ui/package-lock.json
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'clients/acp-ui/src-tauri -> target'
      - name: Install dependencies (Ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Install frontend dependencies
        working-directory: clients/acp-ui
        run: npm ci
      - name: Build and upload desktop installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: clients/acp-ui
          tagName: ${{ needs.version.outputs.version }}
          args: ${{ matrix.args }}
