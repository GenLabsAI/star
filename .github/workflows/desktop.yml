name: desktop

# Build the Star Desktop app (acp-ui submodule + Star overlay patches) and
# attach the installers to the release. Runs automatically after the CLI
# release publishes, or manually via workflow dispatch.
#
# This workflow is independent of the `release` workflow: if the desktop
# build fails, the already-published CLI release is unaffected.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Desktop version to build (without leading v, e.g. 0.1.24)"
        required: true
      tag:
        description: "Existing release tag to upload to (e.g. v0.1.24)"
        required: true

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            name: 'macOS-ARM64'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            name: 'macOS-x64'
          - platform: 'ubuntu-22.04'
            args: ''
            name: 'Linux-x64'
          - platform: 'ubuntu-22.04-arm'
            args: ''
            name: 'Linux-ARM64'
          - platform: 'windows-latest'
            args: ''
            name: 'Windows-x64'
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply Star overlay patches
        shell: bash
        run: |
          for p in clients/star-desktop/patches/*.patch; do
            git -C clients/acp-ui apply --check "$GITHUB_WORKSPACE/$p"
          done
          for p in clients/star-desktop/patches/*.patch; do
            echo "applying $p"
            git -C clients/acp-ui apply "$GITHUB_WORKSPACE/$p"
          done
          git -C clients/acp-ui status --short

      - name: Stamp release version
        shell: bash
        env:
          STAR_DESKTOP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re
          version = os.environ["STAR_DESKTOP_VERSION"]
          conf = "clients/acp-ui/src-tauri/tauri.conf.json"
          s = open(conf).read()
          s, n = re.subn(r'"version": "[^"]+"', f'"version": "{version}"', s, count=1)
          assert n == 1, "version field not found in tauri.conf.json"
          open(conf, "w").write(s)
          cargo = "clients/acp-ui/src-tauri/Cargo.toml"
          s = open(cargo).read()
          s, n = re.subn(r'^version = "[^"]+"', f'version = "{version}"', s, count=1, flags=re.M)
          assert n == 1, "version field not found in Cargo.toml"
          open(cargo, "w").write(s)
          pkg = "clients/acp-ui/package.json"
          d = json.load(open(pkg))
          d["version"] = version
          json.dump(d, open(pkg, "w"), indent=2)
          open(pkg, "a").write("\n")
          print(f"stamped version {version}")
          PYEOF

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: clients/acp-ui/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad56587 # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'clients/acp-ui/src-tauri -> target'

      - name: Install dependencies (Ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        working-directory: clients/acp-ui
        run: npm ci

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: clients/acp-ui
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseName: 'Star Desktop v${{ steps.version.outputs.version }}'
          releaseBody: |
            ## Star Desktop

            The Star Desktop app for this release. Install the Star CLI from the
            main release assets first — the desktop app drives `star acp` from your PATH.

            ### Downloads
            - **Windows**: `.msi` (installer) or `.exe` (NSIS)
            - **macOS**: `.dmg` (Intel or Apple Silicon)
            - **Linux**: `.deb`, `.rpm`, or `.AppImage`
          args: ${{ matrix.args }}
